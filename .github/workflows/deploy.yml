name: Deploy to Hostinger

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, pdo_sqlite, bcmath, dom, filter, gd, json, pdo
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --no-ansi --no-interaction --no-progress

      - name: Test Application
        run: |
          cp .env.example .env
          php artisan key:generate
          composer test

      - name: Prepare Production Dependencies
        run: composer install --no-ansi --no-interaction --no-progress --no-dev --optimize-autoloader

      - name: Prepare SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.SERVER_PORT || 65002 }}" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy with rsync
        run: |
          rsync -rvz --delete --omit-dir-times --no-owner --no-group --no-perms \
            -e "ssh -p ${{ secrets.SERVER_PORT || 65002 }} -i ~/.ssh/id_rsa" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='design-previews/' \
            --exclude='storage/' \
            --exclude='public_html/' \
            --exclude='.env' \
            --exclude='public/hot' \
            --exclude='public/storage' \
            --exclude='bootstrap/cache/' \
            ./ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.TARGET_DIR }}"

      - name: Post-Deployment Commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 65002 }}
          script: |
            set -e
            cd "${{ secrets.TARGET_DIR }}"
            mkdir -p storage/framework/{sessions,views,cache} storage/logs bootstrap/cache public_html
            chmod -R 775 storage bootstrap/cache

            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link || true

            # Hostinger serves public_html; Laravel's public directory is its web root.
            rsync -a --delete --exclude='storage' public/ public_html/
            if [ ! -e public_html/storage ]; then
              ln -s ../storage/app/public public_html/storage
            fi

      - name: Verify public website
        env:
          SITE_URL: https://venerable-mistyrose-quetzal-21.hostingersite.com/
        run: |
          base_url="${SITE_URL%/}"
          echo '| Path | HTTP status |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for path in / /favicon.svg /images/slfa-bg.png /about /membership /happenings /events /news; do
            status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 20 "$base_url$path" || true)
            printf '| `%s` | %s |\n' "$path" "$status" >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" != "200" ]; then
              echo "Public route $path returned HTTP $status"
              failed=1
            fi
          done
          exit "$failed"
